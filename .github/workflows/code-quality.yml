name: Code quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: NoCoolUserName/code-quality/.github/workflows/quality.yml@ac145b028142302c4904094779ec4543726851da # fail-closed Node checks (code-quality#3)
    with:
      install-command: 'python -m pip install --only-binary=:all: --no-deps uv==0.12.23 && uv sync --frozen --extra dev'
      test-command: uv run --frozen --extra dev pytest -q
      node-directory: web
      node-scripts: typecheck test build
      node-required-scripts: typecheck test build
