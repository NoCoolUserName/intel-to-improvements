name: Code quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: NoCoolUserName/code-quality/.github/workflows/quality.yml@3e2c62bef33c74904a7700d79e72c13a6d8cee74 # v1.1.0
    with:
      install-command: 'python -m pip install --only-binary=:all: --no-deps uv==0.12.23 && uv sync --frozen --extra dev'
      test-command: uv run --frozen --extra dev pytest -q
      node-directory: web
      node-scripts: lint test build
