name: Dependency audit

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - web/package.json
      - web/package-lock.json
      - .github/workflows/dependency-audit.yml
      - scripts/dependency_audit.py
      - tests/test_dependency_audit.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test audit result handling with fabricated output
        run: python -m unittest discover -s tests -p test_dependency_audit.py -v
      - name: Install pinned audit tool only
        run: 'python -m pip install --only-binary=:all: pip-audit==2.10.1'
      - name: Audit every external Python package in uv.lock
        run: python scripts/dependency_audit.py python

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.15.0'
      - name: Install pinned npm audit tool only
        run: npm install --global npm@10.9.4
      - name: Audit frontend production and development lockfile dependencies
        run: python3 scripts/dependency_audit.py npm
