# Monthly reviewable proposals. No automatic merge or permission changes.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 1
  groups:
    monthly-updates:
      patterns:
      - '*'
- package-ecosystem: uv
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 1
  groups:
    monthly-updates:
      patterns:
      - '*'
- package-ecosystem: npm
  directory: /web
  schedule:
    interval: monthly
  open-pull-requests-limit: 1
  groups:
    monthly-updates:
      patterns:
      - '*'
